name: PR module imports

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "aeon_neuro/**"
      - ".github/workflows/**"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-core-imports:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install aeon-neuro and core dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: python -m pip install . --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Show dependencies
        run: python -m pip list

      - name: Run import test
        run: python aeon_neuro/testing/tests/test_core_imports.py
