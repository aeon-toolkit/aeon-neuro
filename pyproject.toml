[build-system]
requires = ["setuptools>=84.0.0", "wheel", "toml", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon-neuro"
version = "0.1.0"
description = "A package for EEG classification built on the aeon toolkit."
authors = [
    {name = "aeon developers", email = "contact@aeon-toolkit.org"},
]
maintainers = [
    {name = "aeon developers", email = "contact@aeon-toolkit.org"},
]
readme = "README.md"
keywords = [
    "data-science",
    "machine-learning",
    "time-series",
    "time-series-machine-learning",
    "neuroscience",
    "EEG",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "aeon",
    "mne",
    "mne-bids",
    "pyprep",
    "pyriemann",
    "umap-learn",
    "torch",
    "braindecode",
]

[project.optional-dependencies]
eeg_io = [
    "antio>=0.5",
    "mffpy>=0.11",
    "pymatreader",
    "pyxdf",
    "pybvrf[mne]>=0.1.3,<0.1.4",
]
all_extras = [
    "aeon[all_extras]",
    "aeon-neuro[eeg_io]",
]
dl = [
    "tensorflow>=2.21.0",
    "keras>=3.15.1",
]
dev = [
    "aeon[dev]",
    "edfio",
]
binder = [
    "aeon[binder]",
]
docs = [
    "aeon[docs]",
]

[project.urls]
Homepage = "https://www.aeon-toolkit.org"
Repository = "https://github.com/aeon-toolkit/aeon-neuro"
Download = "https://pypi.org/project/aeon-neuro/#files"

[project.license]
file = "LICENSE"

[tool.setuptools]
zip-safe = true

[tool.setuptools.package-data]
aeon_neuro = [
    "*.csv",
    "*.csv.gz",
    "*.arff",
    "*.arff.gz",
    "*.txt",
    "*.ts",
    "*.tsv",
]

[tool.setuptools.packages.find]
exclude = [
    "experiments", "experiments.*",
    "tests", "tests.*",
    "example_raw_eeg", "example_raw_eeg.*",
]

[tool.check-manifest]
ignore = [
    # Ignore virtual environments in local builds
    "venv/**",
    # Experiments are excluded from the published package
    "experiments/**",
    "example_raw_eeg/**",
    # Ignore the docs symlink and its contents
    "docs/examples",
    "docs/examples/**",
]

[tool.ruff.lint]
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
# ignore certain folders and pytest warnings
testpaths = "aeon_neuro"
addopts = '''
    --doctest-modules
    --durations 20
    --timeout 600
    --showlocals
    --dist worksteal
    --reruns 2
    --only-rerun "crashed while running"
'''
filterwarnings = '''
    ignore::UserWarning
    ignore:numpy.dtype size changed
    ignore:numpy.ufunc size changed
'''
