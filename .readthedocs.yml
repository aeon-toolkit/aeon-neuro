# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

build:
  os: ubuntu-24.04
  tools:
    # Keep the interpreter within project.requires-python in pyproject.toml.
    python: "3.12"

sphinx:
  configuration: docs/conf.py
